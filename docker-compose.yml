services:
  api:
    build: .
    container_name: finance_api

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      - postgres

  postgres:
    image: postgres:17

    container_name: postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
